<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>💰 Школьный счётчик</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(145deg, #0b1120, #1a2636);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
            background-attachment: fixed;
        }

        .app {
            max-width: 480px;
            width: 100%;
            background: linear-gradient(160deg, #1a2636, #0f172a);
            border-radius: 36px;
            padding: 20px 18px 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            border: 1px solid #2a3a50;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .header h1 {
            color: #f1f5f9;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header h1 .age {
            background: #2a3a50;
            font-size: 11px;
            font-weight: 500;
            padding: 0 10px;
            border-radius: 30px;
            color: #94a3b8;
        }

        .btn-reset {
            background: #2a3a50;
            border: none;
            color: #cbd5e1;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #3b4d66;
        }

        .btn-reset:active { transform: scale(0.94); background: #3b4d66; }

        .balance-wrap {
            background: #0b1120;
            border-radius: 40px;
            padding: 14px 12px 12px;
            margin: 10px 0 18px;
            border: 1px solid #2a3a50;
            text-align: center;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.5);
        }

        .balance-label {
            color: #64748b;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .balance {
            font-size: 44px;
            font-weight: 800;
            color: #facc15;
            line-height: 1.2;
            transition: color 0.3s;
            text-shadow: 0 0 30px rgba(250, 204, 21, 0.08);
        }

        .balance.negative { color: #f87171; text-shadow: 0 0 30px rgba(248, 113, 113, 0.1); }

        .group { margin-bottom: 14px; }

        .group-title {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            padding-left: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .group-title .badge {
            background: #2a3a50;
            font-size: 9px;
            padding: 0 8px;
            border-radius: 20px;
            color: #64748b;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .btn {
            padding: 10px 4px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            background: #1e2a3a;
            color: #e2e8f0;
            border: 1px solid #2f4057;
            box-shadow: 0 3px 0 #0b1120;
            text-align: center;
            line-height: 1.2;
            min-height: 44px;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0b1120;
        }

        .btn .emoji { font-size: 16px; }
        .btn .price {
            background: rgba(0,0,0,0.3);
            padding: 0 6px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
        }

        .btn.full { grid-column: 1 / -1; }
        .btn.gold { grid-column: 1 / -1; }

        .btn.green { background: #1a4a3a; border-color: #2a6a50; color: #b8f0d8; }
        .btn.green:active { background: #123a2e; }
        .btn.yellow { background: #5a4a1a; border-color: #8a722a; color: #f5e88a; }
        .btn.yellow:active { background: #4a3a14; }
        .btn.blue { background: #1a2a5a; border-color: #2a4a8a; color: #a8c8f5; }
        .btn.blue:active { background: #14224a; }
        .btn.purple { background: #3a1a5a; border-color: #5a2a8a; color: #d8b8f5; }
        .btn.purple:active { background: #2e144a; }
        .btn.orange { background: #5a3a1a; border-color: #8a5a2a; color: #f5d8a8; }
        .btn.orange:active { background: #4a2e14; }
        .btn.pink { background: #5a1a3a; border-color: #8a2a5a; color: #f5b8d0; }
        .btn.pink:active { background: #4a142e; }
        .btn.red { background: #5a1a1a; border-color: #8a2a2a; color: #f5a8a8; }
        .btn.red:active { background: #4a1414; }
        .btn.cyan { background: #1a4a5a; border-color: #2a6a8a; color: #a8e8f5; }
        .btn.cyan:active { background: #143a4a; }
        .btn.gold { background: #4a3a1a; border-color: #8a722a; color: #f5e88a; }
        .btn.gold:active { background: #3a2e14; }

        .footer {
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #475569;
            border-top: 1px solid #1e2a3a;
            padding-top: 12px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .footer .stats span { color: #94a3b8; font-weight: 600; }
        .footer .stats .good { color: #4ade80; }
        .footer .stats .bad { color: #f87171; }

        .btn-undo {
            background: #2a3a50;
            border: 1px solid #3b4d66;
            color: #cbd5e1;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-undo:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-undo:active:not(:disabled) { transform: scale(0.94); background: #3b4d66; }

        .footer-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(0.92); } 100% { transform: scale(1); } }
        .btn.pop { animation: pop 0.15s ease; }

        @media (max-width: 400px) {
            .app { padding: 14px 10px; }
            .grid { gap: 5px; }
            .btn { font-size: 11px; padding: 8px 3px; min-height: 38px; }
            .balance { font-size: 36px; }
            .header h1 { font-size: 18px; }
            .btn .emoji { font-size: 14px; }
        }

        @media (min-width: 600px) {
            .app { padding: 30px 28px; }
            .balance { font-size: 56px; }
            .btn { font-size: 14px; padding: 14px 8px; min-height: 56px; }
            .header h1 { font-size: 26px; }
            .grid { gap: 10px; }
        }

        .sound-toggle {
            background: #2a3a50;
            border: none;
            color: #94a3b8;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #3b4d66;
        }
        .sound-toggle:active { transform: scale(0.92); }
        .sound-toggle.on { color: #facc15; border-color: #8a722a; }
    </style>
</head>
<body>

<div class="app" id="app">

    <div class="header">
        <h1>📚 Счёт <span class="age">7 лет</span></h1>
        <div style="display:flex; gap:6px; align-items:center;">
            <button class="sound-toggle on" id="soundToggle">🔊</button>
            <button class="btn-reset" id="resetBtn">↺ Сброс</button>
        </div>
    </div>

    <div class="balance-wrap">
        <div class="balance-label">Баланс</div>
        <div class="balance" id="balanceDisplay">0 ₽</div>
    </div>

    <div id="actionsContainer"></div>

    <div class="footer">
        <div class="footer-left">
            <div class="stats">
                ✅ <span class="good" id="goodCount">0</span>
                &nbsp;❌ <span class="bad" id="badCount">0</span>
            </div>
            <button class="btn-undo" id="undoBtn" disabled>↩ Отмена</button>
        </div>
        <div>💾 сохранено</div>
    </div>
</div>

<script>
(function() {
    'use strict';

    const ACTIONS = [
        { group: '📚 Школа', label: 'Задание без капризов', emoji: '📝', price: 10, cls: 'green' },
        { group: '📚 Школа', label: 'Выучил стихотворение', emoji: '📜', price: 12, cls: 'yellow' },
        { group: '📚 Школа', label: 'Прочитал главу книги', emoji: '📖', price: 10, cls: 'blue' },
        { group: '🏠 Дом', label: 'Заправил кровать', emoji: '🛏️', price: 7, cls: 'purple' },
        { group: '🏠 Дом', label: 'Аккуратно сложил одежду', emoji: '👕', price: 5, cls: 'orange' },
        { group: '🎨 Творчество', label: 'Творчество', emoji: '🖍️', price: 5, cls: 'pink' },
        { group: '💪 Привычки', label: 'Выпил тёплой воды утром', emoji: '💧', price: 3, cls: 'cyan' },
        { group: '💪 Привычки', label: 'Сказал, что чувствуешь', emoji: '💬', price: 30, cls: 'yellow' },
        { group: '⛔ Штрафы', label: 'Истерика / капризы', emoji: '😭', price: -40, cls: 'red' },
        { group: '⛔ Штрафы', label: 'Злился и кидал вещи', emoji: '💢', price: -10, cls: 'red' },
        { group: '⛔ Штрафы', label: 'Дрался', emoji: '👊', price: -10, cls: 'red' },
        { group: '⛔ Штрафы', label: 'Обзывался', emoji: '🤬', price: -10, cls: 'red' },
        { group: '🏆 Награды', label: 'Прочитал книгу до конца', emoji: '📚', price: 15, cls: 'gold' },
    ];

    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (_) {}
        }
        return audioCtx;
    }

    function playTone(freq, duration, type, volume) {
        try {
            const ctx = initAudio();
            if (!ctx || !soundEnabled) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime((volume || 0.15), ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration);
        } catch (_) {}
    }

    function playCoin() {
        playTone(880, 0.08, 'sine', 0.12);
        setTimeout(() => playTone(1100, 0.06, 'sine', 0.08), 60);
        setTimeout(() => playTone(1320, 0.1, 'sine', 0.06), 120);
    }

    function playBad() {
        playTone(150, 0.2, 'sawtooth', 0.08);
        setTimeout(() => playTone(100, 0.3, 'sawtooth', 0.06), 80);
    }

    function playUndo() {
        playTone(600, 0.1, 'sine', 0.1);
        setTimeout(() => playTone(450, 0.1, 'sine', 0.08), 70);
    }

    function playReset() {
        playTone(500, 0.08, 'sine', 0.08);
        setTimeout(() => playTone(400, 0.08, 'sine', 0.07), 60);
        setTimeout(() => playTone(300, 0.1, 'sine', 0.06), 120);
    }

    let balance = 0;
    let counts = {};
    let history = [];
    const STORAGE_KEY = 'schoolCounter_v2';

    const balanceEl = document.getElementById('balanceDisplay');
    const goodEl = document.getElementById('goodCount');
    const badEl = document.getElementById('badCount');
    const container = document.getElementById('actionsContainer');
    const undoBtn = document.getElementById('undoBtn');
    const resetBtn = document.getElementById('resetBtn');
    const soundToggle = document.getElementById('soundToggle');

    function loadState() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const data = JSON.parse(raw);
                balance = data.balance ?? 0;
                counts = data.counts ?? {};
                history = data.history ?? [];
                return true;
            }
        } catch (_) {}
        return false;
    }

    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ balance, counts, history }));
        } catch (_) {}
    }

    function updateUI() {
        const prefix = balance < 0 ? '-' : '';
        balanceEl.textContent = `${prefix}${Math.abs(balance)} ₽`;
        balanceEl.className = 'balance' + (balance < 0 ? ' negative' : '');

        let good = 0, bad = 0;
        ACTIONS.forEach((a, i) => {
            const c = counts[i] || 0;
            if (a.price > 0) good += c;
            else bad += c;
        });
        goodEl.textContent = good;
        badEl.textContent = bad;

        undoBtn.disabled = history.length === 0;
        saveState();
    }

    function handleAction(index) {
        const action = ACTIONS[index];
        if (!action) return;

        if (action.price > 0) playCoin();
        else playBad();

        if (!counts[index]) counts[index] = 0;
        counts[index] += 1;
        history.push({ index, price: action.price });
        balance += action.price;
        updateUI();

        const btns = document.querySelectorAll('.btn');
        if (btns[index]) {
            btns[index].classList.remove('pop');
            void btns[index].offsetWidth;
            btns[index].classList.add('pop');
        }
    }

    function undoLast() {
        if (history.length === 0) return;
        playUndo();
        const last = history.pop();
        balance -= last.price;
        if (counts[last.index] && counts[last.index] > 0) {
            counts[last.index] -= 1;
            if (counts[last.index] === 0) delete counts[last.index];
        }
        updateUI();
        undoBtn.classList.remove('pop');
        void undoBtn.offsetWidth;
        undoBtn.classList.add('pop');
    }

    function resetAll() {
        if (confirm('Сбросить баланс и статистику?')) {
            playReset();
            balance = 0;
            counts = {};
            history = [];
            updateUI();
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('pop'));
        }
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
        soundToggle.className = 'sound-toggle' + (soundEnabled ? ' on' : '');
        if (soundEnabled) initAudio();
    }

    function renderActions() {
        const groups = {};
        ACTIONS.forEach((a, i) => {
            if (!groups[a.group]) groups[a.group] = [];
            groups[a.group].push({ ...a, index: i });
        });

        let html = '';
        for (const [groupName, items] of Object.entries(groups)) {
            html += `<div class="group">`;
            html += `<div class="group-title">${groupName} <span class="badge">${items.length}</span></div>`;
            html += `<div class="grid">`;
            items.forEach(item => {
                const priceStr = item.price >= 0 ? `+${item.price}` : `${item.price}`;
                const extra = item.price < 0 ? ' full' : '';
                html += `
                    <button class="btn ${item.cls}${extra}" data-index="${item.index}">
                        <span class="emoji">${item.emoji}</span>
                        ${item.label}
                        <span class="price">${priceStr} ₽</span>
                    </button>
                `;
            });
            html += `</div></div>`;
        }

        container.innerHTML = html;

        container.querySelectorAll('.btn').forEach(btn => {
            const idx = parseInt(btn.dataset.index, 10);
            btn.addEventListener('click', () => handleAction(idx));
            btn.addEventListener('touchstart', () => {}, { passive: true });
        });
    }

    loadState();
    renderActions();
    updateUI();

    resetBtn.addEventListener('click', resetAll);
    undoBtn.addEventListener('click', undoLast);
    soundToggle.addEventListener('click', toggleSound);

    document.addEventListener('touchstart', () => initAudio(), { once: true });
    document.addEventListener('click', () => initAudio(), { once: true });

    window.addEventListener('beforeunload', saveState);
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) saveState();
    });

})();
</script>

</body>
</html>
